version: 1

orchestration:
  max_depth: 3
  default_timeout_ms: 180000

profiles:
  claude-main:
    kind: claude
    model: inherit
    env:
      CLAUDE_CONFIG_DIR: ~/.claude

  # Add extra profiles only for separately authenticated CLI homes.
  # Multiple workers may share one profile/subscription.
  claude-a:
    kind: claude
    model: inherit
    env:
      CLAUDE_CONFIG_DIR: ~/.claude-a

  codex-a:
    kind: codex
    model: inherit
    env:
      CODEX_HOME: ~/.codex-a

roles:
  explorer:
    profiles: [codex-a, claude-a]
    strategy: round-robin
    workspace: shared-readonly

  implementation:
    profiles: [codex-a, claude-a]
    strategy: round-robin
    workspace: isolated-writer

  difficult-implementation:
    profiles: [claude-main, codex-a]
    strategy: strongest-first
    workspace: isolated-writer

  judgment:
    profiles: [claude-main]
    strategy: strongest-first
    workspace: shared-readonly

  reviewer:
    profiles: [claude-main, codex-a, claude-a]
    strategy: spread
    workspace: shared-readonly

  arena-candidate:
    profiles: [claude-main, codex-a, claude-a]
    strategy: spread
    workspace: isolated-writer

  arena-judge:
    profiles: [claude-main, codex-a]
    strategy: spread
    workspace: shared-readonly

  verifier:
    profiles: [codex-a, claude-main]
    strategy: round-robin
    workspace: shared-readonly

  subcoordinator:
    profiles: [claude-main]
    strategy: strongest-first
    workspace: role-dependent
