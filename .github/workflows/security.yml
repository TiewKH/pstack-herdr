name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The scanner is isolated from the host network and sees the checkout
      # read-only. A fixed version is used; Dependabot/security review owns
      # deliberate upgrades.
      - name: Scan lockfiles
        run: |
          docker run --rm --network none -v "$PWD:/src:ro" \
            ghcr.io/google/osv-scanner:v2.5.1 \
            scan source --recursive --include-git-root /src \
            | tee osv-output.txt
          if grep -q 'No package sources found' osv-output.txt; then
            echo "FAIL: osv-scanner found no lockfiles to scan"
            exit 1
          fi

  zizmor:
    name: Workflow static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          version: "1.29.0"
          advanced-security: false
          annotations: true
          persona: pedantic
          min-severity: low
