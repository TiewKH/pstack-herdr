name: One-shot pstack sync

on:
  push:
    branches:
      - sync/pstack-5bf2b154

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Sync pstack
        shell: bash
        run: |
          set -o pipefail
          bun tools/sync.mjs pstack 5bf2b1544db739998121a306340631963c2ff3de 2>&1 | tee sync-report.txt
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/sync-pstack-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sync: import pstack through 5bf2b154"
          git push origin HEAD:${{ github.ref_name }}
