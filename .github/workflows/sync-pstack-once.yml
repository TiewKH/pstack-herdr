name: Validate pstack sync

on:
  push:
    branches:
      - sync/pstack-5bf2b154

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Generate
        run: bun tools/generate.mjs
      - name: Test
        run: bun test tests/
      - name: Herdr runtime contract
        run: node tests/herdr-runtime.test.mjs
      - name: Reject Cursor-only Grok slug
        run: "! grep -R --line-number --fixed-strings 'grok-4.6-fast-xhigh' plugins/pstack/skills"
      - name: Commit generated files
        run: |
          rm .github/workflows/sync-pstack-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: regenerate after pstack sync"
          git push origin HEAD:${{ github.ref_name }}
