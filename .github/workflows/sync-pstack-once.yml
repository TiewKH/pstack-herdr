name: One-shot conflict report

on:
  push:
    branches:
      - sync/pstack-5bf2b154

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Produce merge conflicts
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/cursor/plugins /tmp/upstream
          git -C /tmp/upstream worktree add --detach /tmp/old e8d856f0273b42ebafe0ec3546bd645709e7c1b0
          git -C /tmp/upstream worktree add --detach /tmp/new 5bf2b1544db739998121a306340631963c2ff3de
          cat > /tmp/report.mjs <<'JS'
          import {readFileSync,writeFileSync,mkdtempSync} from "node:fs";
          import {join} from "node:path";
          import {tmpdir} from "node:os";
          import {execFileSync} from "node:child_process";
          const {applySubstitutions}=await import("file://"+process.cwd()+"/tools/sync.mjs");
          const {deriveSkill}=await import("file://"+process.cwd()+"/tools/generate.mjs");
          const rels=["skills/arena/SKILL.md","skills/automate-me/SKILL.md","skills/interrogate/SKILL.md","skills/poteto-mode/playbooks/autopilot-full.md","skills/poteto-mode/playbooks/autopilot-stack.md","skills/poteto-mode/playbooks/babysit.md","skills/poteto-mode/playbooks/bug-fix.md","skills/poteto-mode/playbooks/eval.md","skills/poteto-mode/playbooks/feature.md","skills/poteto-mode/playbooks/multi-phase-plan.md","skills/poteto-mode/playbooks/opening-a-pr.md","skills/poteto-mode/playbooks/orchestrate.md","skills/poteto-mode/playbooks/refactoring.md","skills/poteto-mode/playbooks/session-pickup.md","skills/poteto-mode/playbooks/shipping.md","skills/poteto-mode/playbooks/worktree-cleanup.md","skills/poteto-mode/SKILL.md","skills/reflect/SKILL.md","skills/setup-pstack/SKILL.md","skills/show-me-your-work/SKILL.md","skills/why/references/sources/databricks.md"];
          const {substitutions}=JSON.parse(readFileSync("tools/substitutions.json","utf8"));
          const derive=(root,rel)=>deriveSkill("plugins/pstack/"+rel,applySubstitutions(readFileSync(join(root,"pstack",rel),"utf8"),substitutions).text);
          let report="";
          for(const rel of rels){
            const d=mkdtempSync(join(tmpdir(),"cf-"));
            const ours=join(d,"ours"),base=join(d,"base"),theirs=join(d,"theirs");
            writeFileSync(ours,readFileSync(join("plugins/pstack",rel),"utf8"));
            writeFileSync(base,derive("/tmp/old",rel)); writeFileSync(theirs,derive("/tmp/new",rel));
            let m=""; try{m=execFileSync("git",["merge-file","-p",ours,base,theirs],{encoding:"utf8"});}catch(e){m=String(e.stdout||"");}
            const a=m.split("\n"); let sections=[];
            for(let i=0;i<a.length;i++) if(a[i].startsWith("<<<<<<<")){
              let s=Math.max(0,i-2),j=i; while(j<a.length&&!a[j].startsWith(">>>>>>>"))j++;
              sections.push(a.slice(s,Math.min(a.length,j+3)).join("\n")); i=j;
            }
            report+="\n===== "+rel+" =====\n"+sections.join("\n---\n")+"\n";
          }
          writeFileSync("conflict-hunks.txt",report);
          JS
          bun /tmp/report.mjs
      - name: Commit report
        run: |
          rm .github/workflows/sync-pstack-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: capture sync conflict hunks"
          git push origin HEAD:${{ github.ref_name }}
