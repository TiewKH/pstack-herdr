name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    name: Generated files current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      # The generator stamps VERSION into the manifests, validates the plugin
      # layout, frontmatter flags and Codex marketplace pointer. A dirty tree
      # afterwards means a committed copy is stale (e.g. VERSION bumped
      # without regenerating). git diff ignores untracked files, so a
      # generated file that was never committed needs its own check.
      - name: Regenerate and assert clean tree
        run: |
          bun tools/generate.mjs
          git diff --exit-code
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then
            printf 'FAIL: the generator created files that are not committed:\n%s\n' "$untracked"
            exit 1
          fi
      - name: Tool and invariant fixture tests
        run: bun test tests/
      - name: Herdr runtime contract
        run: node tests/herdr-runtime.test.mjs

  herdr-e2e:
    name: Real Herdr dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Exercise pstack dispatcher through Herdr v0.9.0
        run: bash tests/herdr-e2e.sh

  skills-only:
    name: Skills-only install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the skills tree with the skills CLI
        run: |
          npx --yes skills@1.5.23 add "$PWD/plugins/pstack/skills" \
            --skill '*' --agent codex --yes --copy
      - name: Compare the installed skills tree with the source
        run: diff -qr plugins/pstack/skills .agents/skills

  scripts:
    name: Vendored bun tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/pstack/skills/poteto-mode/scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run shellcheck
        run: |
          shellcheck --version
          find . -path ./.git -prune -o -path '*/node_modules' -prune -o -name '*.sh' -print |
            sed 's#^\./##' | sort | tee /dev/stderr | xargs shellcheck --severity=warning

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -no-color

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run markdownlint
        run: npx --yes markdownlint-cli2@0.18.1 '**/*.md'

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check relative links and fragments
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d \
            --offline --no-progress --include-fragments \
            --exclude-path node_modules --exclude-path .git '**/*.md'
