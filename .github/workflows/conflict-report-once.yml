name: One-shot conflict report

on:
  push:
    branches:
      - sync/pstack-5bf2b154

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Build conflict hunks
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/cursor/plugins /tmp/upstream
          git -C /tmp/upstream worktree add --detach /tmp/old e8d856f0273b42ebafe0ec3546bd645709e7c1b0
          git -C /tmp/upstream worktree add --detach /tmp/new 5bf2b1544db739998121a306340631963c2ff3de
          cat > /tmp/report.mjs <<'JS'
          import { readFileSync, writeFileSync, mkdtempSync } from "node:fs";
          import { join, dirname } from "node:path";
          import { tmpdir } from "node:os";
          import { execFileSync } from "node:child_process";
          import { applySubstitutions } from process.cwd() + "/tools/sync.mjs";
          import { deriveSkill } from process.cwd() + "/tools/generate.mjs";
          const conflicts = [
            "skills/arena/SKILL.md","skills/automate-me/SKILL.md","skills/interrogate/SKILL.md",
            "skills/poteto-mode/playbooks/autopilot-full.md","skills/poteto-mode/playbooks/autopilot-stack.md",
            "skills/poteto-mode/playbooks/babysit.md","skills/poteto-mode/playbooks/bug-fix.md",
            "skills/poteto-mode/playbooks/eval.md","skills/poteto-mode/playbooks/feature.md",
            "skills/poteto-mode/playbooks/multi-phase-plan.md","skills/poteto-mode/playbooks/opening-a-pr.md",
            "skills/poteto-mode/playbooks/orchestrate.md","skills/poteto-mode/playbooks/refactoring.md",
            "skills/poteto-mode/playbooks/session-pickup.md","skills/poteto-mode/playbooks/shipping.md",
            "skills/poteto-mode/playbooks/worktree-cleanup.md","skills/poteto-mode/SKILL.md",
            "skills/reflect/SKILL.md","skills/setup-pstack/SKILL.md","skills/show-me-your-work/SKILL.md",
            "skills/why/references/sources/databricks.md"
          ];
          const { substitutions } = JSON.parse(readFileSync("tools/substitutions.json","utf8"));
          function derived(root, rel) {
            const raw = readFileSync(join(root,"pstack",rel),"utf8");
            return deriveSkill(join("plugins/pstack",rel), applySubstitutions(raw, substitutions).text);
          }
          let out = "";
          for (const rel of conflicts) {
            const dir = mkdtempSync(join(tmpdir(),"merge-"));
            const ours = join(dir,"ours"), base=join(dir,"base"), theirs=join(dir,"theirs");
            writeFileSync(ours, readFileSync(join("plugins/pstack",rel),"utf8"));
            writeFileSync(base, derived("/tmp/old",rel));
            writeFileSync(theirs, derived("/tmp/new",rel));
            let merged="";
            try { merged=execFileSync("git",["merge-file","-p",ours,base,theirs],{encoding:"utf8"}); }
            catch (e) { merged=e.stdout?.toString() ?? ""; }
            const lines=merged.split("\n");
            const parts=[];
            for(let i=0;i<lines.length;i++) if(lines[i].startsWith("<<<<<<<")){
              let s=Math.max(0,i-3), j=i;
              while(j<lines.length && !lines[j].startsWith(">>>>>>>")) j++;
              let e=Math.min(lines.length,j+4);
              parts.push(lines.slice(s,e).join("\n"));
              i=j;
            }
            out += "\n===== " + rel + " =====\n" + parts.join("\n---\n") + "\n";
          }
          writeFileSync("conflict-hunks.txt",out);
          JS
          bun /tmp/report.mjs
      - name: Remove workflow and commit report
        shell: bash
        run: |
          rm .github/workflows/conflict-report-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conflict-hunks.txt .github/workflows/conflict-report-once.yml
          git commit -m "chore: capture upstream sync conflict hunks"
          git push origin HEAD:${{ github.ref_name }}
